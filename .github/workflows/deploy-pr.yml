name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy PR preview to subdirectory
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          destination_dir: pr-${{ github.event.number }}
          keep_files: true
          exclude_assets: '.github,.gitignore,.idea,*.md,LICENSE,checkhtml.sh,old.htm'

      - name: Post or update preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `https://install.wled.me/pr-${{ github.event.number }}/`;
            const marker = '<!-- wled-preview-comment -->';
            const body = `${marker}\n### Preview deployment\n\n**${previewUrl}**`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.data.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
